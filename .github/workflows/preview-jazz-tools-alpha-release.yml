name: Preview jazz-tools alpha release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    uses: ./.github/workflows/build-jazz-packages.yml
    with:
      napi_matrix: '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","platform":"linux-x64-gnu","use_sccache":false},{"os":"macos-15-intel","target":"x86_64-apple-darwin","platform":"darwin-x64","use_sccache":false},{"os":"macos-15","target":"aarch64-apple-darwin","platform":"darwin-arm64","use_sccache":false}]'
      include_rn: true
  native-regression:
    runs-on: ubuntu-24.04
    env:
      CACHE_SCOPE_REPOSITORY_ID: ${{ github.repository_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: ./.github/actions/setup-build
        with:
          rust-targets: wasm32-unknown-unknown
      - uses: ./.github/actions/install-rust-tool
        with:
          tool: wasm-pack@0.13.1
      - run: pnpm build:correctness-artifacts
      - run: node dev/gates/run-correctness-consumer.mjs -- pnpm --filter jazz-tools build
      - run: pnpm --filter jazz-tools test:node src/backend/nullable-json.integration.test.ts
